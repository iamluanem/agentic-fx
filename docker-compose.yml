# Agentic FX — local stack.  Run:  docker compose up --build
# Then open http://localhost:3000 and sign in as demo@agentic.fx / demo-password.
#
# Secrets: the defaults below are for local development only. Put real values in a .env file next to this one
# (see .env.example); never commit it.

name: agentic-fx

x-jwt: &jwt ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenticfx
      POSTGRES_USER: agenticfx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agenticfx}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticfx -d agenticfx"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  fx-api:
    build: ./fx-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/agenticfx
      DB_USER: agenticfx
      DB_PASSWORD: ${DB_PASSWORD:-agenticfx}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_BROKER: kafka
      JWT_SECRET: *jwt
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FX_PROVIDER: mock
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  agent-service:
    build: ./agent-service
    environment:
      FX_API_URL: http://fx-api:8080
      JWT_SECRET: *jwt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    ports: ["8000:8000"]
    depends_on:
      fx-api: { condition: service_healthy }

  web:
    build: ./web
    environment:
      FX_API_URL: http://fx-api:8080
      AGENT_API_URL: http://agent-service:8000
    ports: ["3000:3000"]
    depends_on:
      fx-api: { condition: service_healthy }
      agent-service: { condition: service_healthy }

volumes:
  pgdata:
